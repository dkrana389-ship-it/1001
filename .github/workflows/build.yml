name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q ReelCounter.zip -d work
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build release APK
        working-directory: work/ReelCounter
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ReelCounter-APK
          path: work/ReelCounter/app/build/outputs/apk/release/app-release.apk
